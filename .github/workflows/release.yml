name: Celeste+ protected Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: celeste-plus-production-release
  cancel-in-progress: false

jobs:
  release:
    # Lite is already licensed locally and has a GUI, not a headless compiler.
    # Use an isolated, unlocked interactive runner. Never run PR jobs on it.
    runs-on: [self-hosted, Windows, X64, celeste-release]
    environment: celeste-plus-production
    timeout-minutes: 60
    if: github.repository == 'c4lamity007/Celeste-Plus' && github.event.repository.private == true
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TOOLCHAIN_BUNDLE: ${{ vars.NATIVE_TOOLCHAIN_BUNDLE }}
      TOOLCHAIN_SHA256: ${{ vars.NATIVE_TOOLCHAIN_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release identity and provisioned toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[A-Za-z0-9][A-Za-z0-9_-]{0,77}$') { throw 'Release requires an existing v-prefixed tag using letters, digits, hyphens or underscores.' }
          $taskCommit = (& git rev-parse HEAD).Trim()
          $taskTagCommit = (& git rev-parse --verify "refs/tags/$env:RELEASE_TAG^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $taskCommit -ne $taskTagCommit) { throw 'Checkout differs from the release tag.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Only commits on Celeste-Plus/main can be released.' }
          if ((& git remote get-url --push origin).Trim() -ne 'https://github.com/c4lamity007/Celeste-Plus') {
            if ((& git remote get-url --push origin).Trim() -ne 'https://github.com/c4lamity007/Celeste-Plus.git') { throw 'Wrong publication repository.' }
          }
          if (-not (Test-Path -LiteralPath $env:TOOLCHAIN_BUNDLE -PathType Leaf) -or $env:TOOLCHAIN_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'Configure the independently reviewed private MCP/protection adapter bundle and its SHA-256.' }
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,llvm-tools-preview
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust installation failed.' }
          "RELEASE_DIRECTORY=$env:RUNNER_TEMP/celeste-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_COMMIT=$taskCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test release gates and auth server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -r auth-service/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
          python -m unittest discover -s tools/qa -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Release gate tests failed.' }
          python -m unittest discover -s beta-lab/obfuscation -p test_protect_java_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Java source receipt tests failed.' }
          python -m unittest discover -s tests -p test_protect_java_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Java protection runner tests failed.' }
          Push-Location auth-service
          try {
            python -m pytest tests -q
            if ($LASTEXITCODE -ne 0) { throw 'Auth tests failed.' }
          } finally { Pop-Location }
          $env:RUSTFLAGS = '-Dwarnings'
          cargo fmt --manifest-path beta-lab/native-launcher/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          cargo test --locked --manifest-path beta-lab/native-launcher/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed.' }

      - name: Build, strip and protect through the reviewed MCP adapter
        shell: pwsh
        run: |
          ./tools/packaging/protect-sign-windows-native.ps1 -Mode Prepare -Bundle $env:TOOLCHAIN_BUNDLE -BundleSha256 $env:TOOLCHAIN_SHA256 -ReleaseId $env:RELEASE_TAG -OutputDirectory $env:RELEASE_DIRECTORY
          if (-not $?) { throw 'Native protection failed.' }

      # TODO (paid identity): provision a trusted Windows publisher identity.
      # Current public certificates normally use hardware/cloud-held keys; an EV
      # certificate is not mandatory. Store mode supports a provisioned Windows
      # CSP/KSP identity; Pfx is only for a legitimately exportable identity.
      # The accepted historical Unknown publisher release is not a CI fallback.
      # Unconfigured identities must fail; unsigned dev builds use platform CI.
      - name: Sign final bytes and reverify native protection
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          CELESTE_SIGNING_CERT_THUMBPRINT: ${{ vars.CELESTE_SIGNING_CERT_THUMBPRINT }}
          SIGNING_PROVIDER: ${{ vars.SIGNING_PROVIDER || 'Store' }}
        run: |
          ./tools/packaging/protect-sign-windows-native.ps1 -Mode Sign -SigningProvider $env:SIGNING_PROVIDER -Bundle $env:TOOLCHAIN_BUNDLE -BundleSha256 $env:TOOLCHAIN_SHA256 -ReleaseId $env:RELEASE_TAG -OutputDirectory $env:RELEASE_DIRECTORY
          if (-not $?) { throw 'Signing or final verification failed.' }

      - name: Register reviewed bytes and publish the private release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CELESTE_NATIVE_RELEASE_PRIVATE_KEY: ${{ secrets.CELESTE_NATIVE_RELEASE_PRIVATE_KEY }}
          CELESTE_RETAINED_NATIVE_POLICY: ${{ secrets.CELESTE_RETAINED_NATIVE_POLICY }}
          CELESTE_NATIVE_RELEASE_SEQUENCE: ${{ vars.CELESTE_NATIVE_RELEASE_SEQUENCE }}
          CELESTE_BACKEND_RELEASE_ID: ${{ vars.CELESTE_BACKEND_RELEASE_ID }}
        run: |
          python tools/packaging/publish_native_github.py --directory $env:RELEASE_DIRECTORY --tag $env:RELEASE_TAG --commit $env:RELEASE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Publication was not confirmed; inspect the retained draft and policy evidence.' }

      - name: Notify configured release channel
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if ($env:DISCORD_WEBHOOK) {
            $taskBody = @{content="Celeste+ $env:RELEASE_TAG is live: https://github.com/c4lamity007/Celeste-Plus/releases/tag/$env:RELEASE_TAG"; allowed_mentions=@{parse=@()}} | ConvertTo-Json -Depth 4
            Invoke-RestMethod -Method Post -Uri $env:DISCORD_WEBHOOK -ContentType 'application/json' -Body $taskBody | Out-Null
          }
