plugins { id 'java' }
group = 'dev.c4lam.celeste.plus'
version = '0.1.0'
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
    implementation('com.google.code.gson:gson:2.13.2') { exclude group: 'com.google.errorprone', module: 'error_prone_annotations' }
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'org.ow2.asm:asm-tree:9.10.1'
    implementation 'org.ow2.asm:asm-analysis:9.10.1'
    compileOnly 'com.google.errorprone:error_prone_annotations:2.48.0'
    // Delivery's isolated hardware reader resolves the game's JNA at runtime.
    compileOnly 'net.java.dev.jna:jna:5.19.0'
    compileOnly 'net.java.dev.jna:jna-platform:5.19.0'
    testImplementation 'net.java.dev.jna:jna:5.19.0'
    testImplementation 'net.java.dev.jna:jna-platform:5.19.0'
    testCompileOnly 'com.google.errorprone:error_prone_annotations:2.48.0'
}
sourceSets {
    main {
        // The standalone host owns its auth helpers; it never imports normal-client sources.
        java.srcDirs = ['beta-lab/bootstrap-a/src', 'beta-lab/delivery-client/src', 'beta-lab/memory-runtime/src/main/java',
            'beta-lab/shared-auth/src/main/java'] +
            ['combined-hooks', 'reload-hooks', 'interaction-hooks', 'rotation-hooks', 'fake-gamble-hooks', 'gameplay-callbacks', 'visual-hooks', 'atmosphere-hooks'].collect { "beta-lab/${it}/src/main/java" }
    }
    test { java.srcDirs = ['beta-lab/bootstrap-a/test', 'beta-lab/delivery-client/test',
        'beta-lab/memory-runtime/src/test/java', 'beta-lab/shared-auth/src/test/java'] }
    bootstrapB {
        java.srcDirs = ['beta-lab/bootstrap-b/src']
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
    payloadFixture {
        java.srcDirs = ['beta-lab/payload-session/src', 'beta-lab/bootstrap-b/fixtures/core', 'beta-lab/integrity-adapter/src/test/java']
        java.exclude 'fixture/**'
        // Select the actual integrity implementation rather than the payload-session stub.
        java.exclude { details -> details.file == file('beta-lab/payload-session/src/dev/c4lam/celeste/auth/ArtifactIntegrity.java') }
    }
    bootstrapBTest {
        java.srcDirs = ['beta-lab/bootstrap-b/test']
        compileClasspath += sourceSets.main.output + sourceSets.test.output + sourceSets.bootstrapB.output + sourceSets.payloadFixture.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output + sourceSets.bootstrapB.output + sourceSets.payloadFixture.output + configurations.runtimeClasspath
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror', '--add-modules', 'jdk.attach']
}
tasks.withType(Jar).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
def aCheck = tasks.register('betaBootstrapACheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.celestebeta.bootstrap.external.BootstrapACheck'
    args layout.buildDirectory.dir('module-qa/bootstrap-a/fixtures').get().asFile.absolutePath
    enableAssertions = true
    jvmArgs '-Xverify:all', '-XX:-DisableExplicitGC', '-XX:+ClassUnloading'
}
// Explicit additional gate for release validation. Default host checks use
// synthetic schemas and have no Minecraft artifact or user-cache dependency.
tasks.register('betaMinecraftSchemaCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.celestebeta.bootstrap.external.BootstrapACheck'
    enableAssertions = true
    jvmArgs '-Xverify:all', '-XX:-DisableExplicitGC', '-XX:+ClassUnloading'
    doFirst {
        def schemaPath = providers.gradleProperty('minecraftSchemaJar').orNull
        if (schemaPath == null || !file(schemaPath).isFile()) {
            throw new GradleException('betaMinecraftSchemaCheck requires -PminecraftSchemaJar=/path/to/the/Minecraft-1.21.11-named.jar. It is read as an offline fixture and never launched.')
        }
        args '--minecraft-schema', file(schemaPath).absolutePath
    }
}
def deliveryCheck = tasks.register('betaDeliveryClientCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.c4lam.celeste.beta.delivery.BetaDeliveryClientCheck'
    args file('beta-lab/delivery-client/fixtures/server-schema2-v2-golden.json').absolutePath
    enableAssertions = true
    jvmArgs '-Xverify:all'
}
def bCheck = tasks.register('betaBootstrapBCheck', JavaExec) {
    dependsOn tasks.named('bootstrapBTestClasses'), tasks.named('payloadFixtureClasses')
    classpath = sourceSets.bootstrapBTest.runtimeClasspath
    mainClass = 'dev.c4lam.celeste.beta.delivery.BootstrapBCheck'
    args sourceSets.payloadFixture.output.classesDirs.singleFile.absolutePath
    enableAssertions = true
    jvmArgs '-Xverify:all', '-XX:-DisableExplicitGC', '-XX:+ClassUnloading'
}
def memoryCheck = tasks.register('betaMemoryRuntimeCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.c4lam.celeste.beta.memory.TwoPartMemoryClassLoaderTest'
    enableAssertions = true
    jvmArgs '-Xverify:all'
}
def environmentCheck = tasks.register('betaEnvironmentGateCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.c4lam.celeste.auth.EnvironmentGateCheck'
    enableAssertions = true
}
def hookCheckOutput = layout.buildDirectory.dir('module-qa/hook-argument-frames/classes')
def compileHookCheck = tasks.register('compileBetaHookArgumentFramesCheck', JavaCompile) {
    dependsOn tasks.named('classes')
    source file('beta-lab/combined-hooks/src/test/java/dev/celestebeta/host/fixture/HookArgumentFramesCheck.java')
    classpath = sourceSets.main.output + configurations.compileClasspath
    destinationDirectory = hookCheckOutput
}
def hookCheck = tasks.register('betaHookArgumentFramesCheck', JavaExec) {
    dependsOn compileHookCheck
    classpath = files(hookCheckOutput) + sourceSets.main.runtimeClasspath
    mainClass = 'dev.celestebeta.host.fixture.HookArgumentFramesCheck'
    enableAssertions = true
    jvmArgs '-Xverify:all'
}
// Compile the real session controller against only its controlled game/auth fixtures.
def sessionCheckOutput = layout.buildDirectory.dir('module-qa/payload-session/classes')
def compileSessionCheck = tasks.register('compileBetaPayloadSessionCheck', JavaCompile) {
    source fileTree('beta-lab/payload-session/src') { include '**/*.java' }
    source file('beta-lab/bootstrap-b/fixtures/core/dev/c4lam/celeste/beta/lifecycle/BetaPayloadSession.java')
    classpath = files()
    destinationDirectory = sessionCheckOutput
}
def sessionCheck = tasks.register('betaPayloadSessionCheck', JavaExec) {
    dependsOn compileSessionCheck
    classpath = files(sessionCheckOutput)
    mainClass = 'fixture.SessionCheck'
    enableAssertions = true
    jvmArgs '-Xverify:all'
}
def bootstrapA = tasks.register('betaBootstrapAJar', Jar) {
    dependsOn tasks.named('classes')
    from sourceSets.main.output
    from({ configurations.runtimeClasspath.collect { zipTree(it) } }) { exclude 'META-INF/**', 'module-info.class' }
    if (project.hasProperty('betaPackageDirectory')) {
        def prepared = file(project.property('betaPackageDirectory'))
        from(new File(prepared, 'host-support')) { into 'META-INF/celeste-beta/host-jars'; include '*.jar' }
        from(new File(prepared, 'bootstrap-trust.json')) { into 'META-INF/celeste-beta' }
    }
    archiveFileName = 'bootstrap-a.jar'
    destinationDirectory = layout.buildDirectory.dir('module-qa/bootstrap-a')
    manifest { attributes('Implementation-Title': 'Celeste+ host', 'Celeste-Beta-Bootstrap': 'A',
        'Agent-Class': 'dev.celestebeta.attach.AgentMain', 'Main-Class': 'dev.celestebeta.attach.AttachCli', 'Can-Retransform-Classes': 'true') }
}
def bootstrapB = tasks.register('betaBootstrapBJar', Jar) {
    dependsOn tasks.named('bootstrapBClasses')
    from sourceSets.bootstrapB.output
    if (project.hasProperty('betaLayoutFile')) {
        from(file(project.property('betaLayoutFile'))) { into 'META-INF/celeste-beta'; rename { 'runtime-layout.json' } }
    }
    if (project.hasProperty('betaPackageDirectory')) {
        def nativeBudget = new File(file(project.property('betaPackageDirectory')), 'native-auth-resources.txt')
        if (nativeBudget.isFile()) { from(nativeBudget) { into 'META-INF/celeste-beta' } }
    }
    archiveFileName = 'bootstrap-b.bin'
    destinationDirectory = layout.buildDirectory.dir('module-qa/bootstrap-b')
    manifest { attributes('Implementation-Title': 'Celeste+ internal bootstrap', 'Celeste-Beta-Bootstrap': 'B') }
}
tasks.named('check') { dependsOn aCheck, deliveryCheck, bCheck, memoryCheck, environmentCheck, hookCheck, sessionCheck }
tasks.named('assemble') { dependsOn bootstrapA, bootstrapB }

// Regression suites are explicit Java main programs, not JUnit-discovered tests.
tasks.named('test') { enabled = false }

// Signed transport rotation is tested with public backend vectors and loopback TLS only.
def tlsPolicyCheck = tasks.register('betaTlsPolicyCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.c4lam.celeste.auth.PinnedTlsCheck'
    args file('auth-service/tests/fixtures/transport-policy-v1.json').absolutePath
    enableAssertions = true
}
tasks.named('check') { dependsOn tlsPolicyCheck }

def deliveryHardwareCheck = tasks.register('betaArtifactHardwareCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.c4lam.celeste.auth.ArtifactHardwareIdentityCheck'
    enableAssertions = true
    jvmArgs '-Xverify:all'
    if (providers.gradleProperty('nativeHardwareParityFile').isPresent()) args providers.gradleProperty('nativeHardwareParityFile').get()
}
tasks.named('check') { dependsOn deliveryHardwareCheck }

// Explicit runtime protocol fixture requires a prepared pinned core, never a live game.
configurations { runtimeAuthCheckDependencies }
dependencies {
    runtimeAuthCheckDependencies 'net.java.dev.jna:jna:5.19.0'
    runtimeAuthCheckDependencies 'net.java.dev.jna:jna-platform:5.19.0'
}
def runtimeAuthCheckOutput = layout.buildDirectory.dir('module-qa/runtime-auth-check/classes')
def compileRuntimeAuthCheck = tasks.register('compileRuntimeAuthCheck', JavaCompile) {
    dependsOn tasks.named('classes')
    source fileTree('beta-lab/runtime-auth-check/src') { include '**/*.java' }
    source fileTree('beta-lab/runtime-auth-check/stubs') { include '**/*.java' }
    source file('beta-lab/bootstrap-a/test/dev/c4lam/celeste/beta/delivery/RuntimeInstallationSignerCheck.java')
    source file('runtime-overlay/src/main/java/dev/c4lam/celeste/auth/AuthServiceClient.java')
    source file('runtime-overlay/src/main/java/dev/c4lam/celeste/auth/CredentialStore.java')
    source file('runtime-overlay/src/main/java/dev/c4lam/celeste/auth/HardwareIdentityV2.java')
    source file('runtime-overlay/src/main/java/dev/celestebeta/host/ResourceReloadBridge.java')
    ['Crypto', 'AuthConfig', 'InstallCredential'].each { name -> source file("build/runtime-core/src/main/java/dev/c4lam/celeste/auth/${name}.java") }
    classpath = sourceSets.main.output + configurations.compileClasspath + configurations.runtimeAuthCheckDependencies
    destinationDirectory = runtimeAuthCheckOutput
    doFirst {
        if (!file('build/runtime-core/src/main/java/dev/c4lam/celeste/auth/Crypto.java').isFile())
            throw new GradleException('runtimeAuthProtocolCheck requires the pinned runtime core from tools/prepare_runtime.py; no user Minecraft files are used.')
    }
}
tasks.register('runtimeAuthProtocolCheck', JavaExec) {
    dependsOn compileRuntimeAuthCheck
    classpath = files(runtimeAuthCheckOutput) + sourceSets.main.runtimeClasspath + configurations.runtimeAuthCheckDependencies
    mainClass = 'dev.c4lam.celeste.auth.BetaClientProtocolCheck'
    enableAssertions = true
    jvmArgs '-Xverify:all'
}

tasks.register('runtimeHardwareIdentityCheck', JavaExec) {
    dependsOn compileRuntimeAuthCheck
    classpath = files(runtimeAuthCheckOutput) + sourceSets.main.runtimeClasspath + configurations.runtimeAuthCheckDependencies
    mainClass = 'dev.c4lam.celeste.auth.HardwareIdentityV2Check'
    enableAssertions = true
    if (providers.gradleProperty('nativeHardwareParityFile').isPresent()) args providers.gradleProperty('nativeHardwareParityFile').get()
}

// Synthetic credential round trips and secret lifecycle; never opens a user credential.
tasks.register('runtimeCredentialSecretCheck', JavaExec) {
    dependsOn compileRuntimeAuthCheck
    classpath = files(runtimeAuthCheckOutput) + sourceSets.main.runtimeClasspath + configurations.runtimeAuthCheckDependencies
    mainClass = 'dev.c4lam.celeste.auth.CredentialSecretCheck'
    enableAssertions = true
    jvmArgs '-Xverify:all'
    def fixture = layout.buildDirectory.dir('module-qa/credential-secret-fixture')
    doFirst { fixture.get().asFile.mkdirs() }
    args fixture.get().asFile.absolutePath
}
